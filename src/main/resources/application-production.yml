app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
  mcp:
    public-base-url: ${MCP_PUBLIC_BASE_URL}
    issuer-uri: ${MCP_ISSUER_URI}
    resource-uri: ${MCP_RESOURCE_URI:${MCP_PUBLIC_BASE_URL}/mcp}
    allowed-hosts: ${MCP_ALLOWED_HOSTS}
    allowed-origins: ${MCP_ALLOWED_ORIGINS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
spring:
  jpa:
    hibernate:
      ddl-auto: validate
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
